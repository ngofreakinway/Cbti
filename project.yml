name: QuietMind
options:
  bundleIdPrefix: com.quietmind
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.quietmind.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  QuietMind:
    type: application
    platform: iOS
    sources:
      - path: QuietMind
    info:
      path: QuietMind/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: "QuietMind sends reminders for your sleep diary and bedtime wind-down."
        NSHealthShareUsageDescription: "QuietMind reads your sleep data from Apple Health to pre-populate your morning diary."
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: QuietMind/QuietMind.entitlements
